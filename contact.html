<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Bank ขายบ้าน</title>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body id="page-top">

    <!-- Menu -->
    <div id="menu"></div>

    <!-- Contact -->
    <section class="tb-contact">
        <div class="container">

            <!-- Heading -->
            <div class="text-center mb-5">
                <span class="about-tag">CONTACT US</span>
                <h1 class="fw-bold mt-3">ติดต่อเรา</h1>
                <p class="text-muted">
                    ปรึกษาฟรี เรื่องซื้อ ขาย เช่า และสินเชื่อบ้าน
                </p>
            </div>

            <div class="row g-5">

                <!-- Form -->
                <div class="col-lg-7">

                    <div class="contact-card">

                        <h3 class="fw-bold mb-4">ส่งข้อความถึงเรา</h3>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">ชื่อ - นามสกุล</label>
                                <input type="text" class="form-control" placeholder="กรอกชื่อของคุณ" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="example@email.com" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">เบอร์โทรศัพท์</label>
                                    <input type="tel" class="form-control" placeholder="08X-XXX-XXXX" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">หัวข้อ</label>
                                <select class="form-select" required>
                                    <option value="" selected disabled>เลือกหัวข้อ</option>
                                    <option>สนใจซื้อบ้าน</option>
                                    <option>สนใจขายบ้าน</option>
                                    <option>สนใจเช่าบ้าน</option>
                                    <option>ปรึกษาสินเชื่อ</option>
                                    <option>อื่น ๆ</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">รายละเอียด</label>
                                <textarea class="form-control" rows="6" placeholder="พิมพ์รายละเอียดที่ต้องการสอบถาม..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill px-5">ส่งข้อความ</button>

                        </form>

                    </div>

                </div>

                <!-- Contact Info -->
                <div class="col-lg-5">
                    <div class="contact-card mb-4">
                        <h3 class="fw-bold mb-4">ข้อมูลติดต่อ</h3>
                        <div class="contact-item">
                            <i class="bi bi-geo-alt-fill"></i>
                            <div>
                                <h6>ที่อยู่</h6>
                                <p>กรุงเทพมหานคร ประเทศไทย</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <i class="bi bi-telephone-fill"></i>
                            <div>
                                <h6>โทรศัพท์</h6>
                                <p>08X-XXX-XXXX</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <i class="bi bi-envelope-fill"></i>
                            <div>
                                <h6>Email</h6>
                                <p>thebankhouse@email.com</p>
                            </div>
                        </div>
                    </div>

                    <!-- Map -->
                    <div class="contact-card p-0 overflow-hidden">
                        <iframe src="https://www.google.com/maps?q=Bangkok&output=embed" width="100%" height="320" style="border:0;" loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

</body>
</html>

<script>
document.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', function(e){
        e.preventDefault();

        const btn = this.closest('.dropdown')
                        .querySelector('.dropdown-toggle');

        btn.textContent = this.textContent;
    });
});
</script>
<script src="js/menu.js"></script>
<script src="js/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
